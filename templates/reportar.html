<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar problema</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/inicio">Inicio</a>
        <a href="/reportar">Reportar problema</a>
        <a href="/problemas">Ver problemas</a>
        <a href="/calendario">Calendario</a>
        <a href="/noticias">Noticias</a>
        <a href="/ideas">Ideas de estudiantes</a>
        <a href="/bullying">Bullying</a>
        <a href="/logout">Cerrar sesion</a>
    </nav>

    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo del colegio" class="logo-flotante">

    <h1>&#128680; Reportar un problema</h1>

    <form action="/reportar" method="POST" enctype="multipart/form-data">
        <label for="tipo">Tipo de problema:</label><br>
        <select name="tipo" id="tipo">
            <option value="Luces dañadas">Luces dañadas</option>
            <option value="Baños en mal estado">Baños en mal estado</option>
            <option value="Basura">Basura</option>
            <option value="Pupitres dañados">Pupitres dañados</option>
            <option value="Otro">Otro</option>
        </select><br><br>

        <label for="lugar">Lugar:</label><br>
        <input type="text" name="lugar" id="lugar"><br><br>

        <label for="descripcion">Descripción:</label><br>
        <textarea name="descripcion" id="descripcion" rows="4" cols="40"></textarea><br><br>

        <label for="foto">Foto (opcional):</label><br>
        <input type="file" name="foto" id="foto" accept="image/*"><br><br>

        <button type="submit">Enviar reporte</button>
    </form>
</body>
</html>
